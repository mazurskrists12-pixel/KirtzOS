name: kirtz-os
description: KirtzOS - My personal high-performance Bazzite spin stripped of default bloat, pre-configured with Oxygen Dark, Zen Browser, and out-of-the-box gaming gear.
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: rpm-ostree
    install:
      # Pre-installed Oxygen themes & system monitoring tools
      - plasma-oxygen
      - oxygen-icon-theme
      - plasma-oxygen-decls
      - fastfetch
      - lutris
      - mangohud
      - goverlay
    remove:
      # Swapped out Firefox in favor of Zen Browser
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    notify: true
    system:
      install:
        - io.github.zen_browser.zen
        - com.valvesoftware.Steam
        - com.discordapp.Discord
        - com.obsproject.Studio
        - org.videolan.VLC
        - com.heroicgameslauncher.hgl
        - net.davidotek.pupgui2

  - type: brew
    brew:
      nofile: true
    install-taps:
      - homebrew/cask
      - homebrew/core
    install-formulae:
      - gcc
      - git
      - wget

  - type: script
    scripts:
      - set_oxygen_dark.sh
      
