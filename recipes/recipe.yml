# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kirtz-os
description: KirtzOS - My personal high-performance Bazzite spin stripped of default bloat, pre-configured with Oxygen Dark, Zen Browser, and out-of-the-box gaming gear.
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: latest

modules:
  - type: rpm-ostree
    install:
      # Desktop, Themes & System Polish
      - plasma-oxygen
      - oxygen-icon-theme
      - kvantum
      # Terminal & Performance Utilities
      - starship
      - fastfetch
      - lutris
      - mangohud
      - goverlay
    remove:
      - firefox
      - firefox-langpacks

  - type: default-flatpaks
    notify: true
    system:
      install:
        - io.github.zen_browser.zen
        - com.valvesoftware.Steam
        - com.discordapp.Discord
        - com.obsproject.Studio
        - org.videolan.VLC
        - com.heroicgameslauncher.hgl
        - net.davidotek.pupgui2 # ProtonUp-Qt
        - com.github.wwmm.easyeffects # PipeWire Audio Booster

  - type: brew
    nofile-limits: true

  - type: script
    scripts:
      - set_oxygen_dark.sh
      - setup_starship.sh
